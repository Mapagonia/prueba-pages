    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script>
            // Declaramos el GeoJSON vacío para que qgis2web no colapse
            var json_punto_test_1 = { "type": "FeatureCollection", "features": [] };
        </script>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="layers/punto_test_1.js"></script>
        <script src="styles/punto_test_1_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>  
        <script>
            window.addEventListener('load', async function() {
                // Inicializar Supabase
                const supabaseUrl = 'https://emmthnrletlglxomcgbs.supabase.co';
                const supabaseKey = 'sb_publishable_CHcG6hJYhsxWtECZKxN8cQ_aSu1mksw';
                const supabase = supabase.createClient(supabaseUrl, supabaseKey);

                // Asumimos que tenés una tabla llamada 'puntos_territorio' 
                // y una función RPC 'obtener_geojson_tabla' que devuelve los datos.
                const { data, error } = await supabase
                    .rpc('obtener_geojson_tabla', { nombre_tabla: 'punto_test' });

                if (error) {
                    console.error("Error al traer datos de Supabase:", error);
                    return;
                }

                // --- MAGIA DE OPENLAYERS ---
                
                // 1. Instanciamos el lector de GeoJSON
                var formatoGeoJSON = new ol.format.GeoJSON();
                
                // 2. Leemos los datos que llegaron de Supabase y los proyectamos
                // OpenLayers necesita saber que la base de datos está en 4326 (WGS84) 
                // y el mapa web en 3857 (Web Mercator)
                var nuevasFeatures = formatoGeoJSON.readFeatures(data, {
                    dataProjection: 'EPSG:4326', 
                    featureProjection: 'EPSG:3857'
                });

                // 3. Limpiamos la "bolsa" original (por si acaso) y metemos los puntos nuevos
                jsonSource_punto_test_1.clear();
                jsonSource_punto_test_1.addFeatures(nuevasFeatures);
                
                console.log("¡Datos inyectados desde Supabase exitosamente!");
            });
        </script>        
    </body>
</html>
