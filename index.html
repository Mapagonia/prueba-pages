<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script>
            // --- 1. CASCARÓN VACÍO ---
            // Declaramos el GeoJSON vacío para engañar a qgis2web
            var json_Poligono_1 = { "type": "FeatureCollection", "features": [] };

            // --- 2. CÓDIGO ORIGINAL DE QGIS2WEB ---
            var map = L.map('map', {
                zoomControl:false, maxZoom:28, minZoom:1
            }).fitBounds([[-45.5634911132688,-70.98536076477181],[-40.97518784142776,-58.38518948225615]]);

            var hash = new L.Hash(map);
            map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
            var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

            // remove popup's row if "visible-with-data"
            function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
            }

            // modify popup if contains media
            function addClassToPopupIfMedia(content, popup) {
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                var imgTd = tempDiv.querySelector('td img');
                if (imgTd) {
                    var src = imgTd.getAttribute('src');
                    if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                        popup._contentNode.classList.add('media');
                        setTimeout(function() {
                            popup.update();
                        }, 10);
                    } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                        var audio = document.createElement('audio');
                        audio.controls = true;
                        audio.src = src;
                        imgTd.parentNode.replaceChild(audio, imgTd);
                        popup._contentNode.classList.add('media');
                        setTimeout(function() {
                            popup.setContent(tempDiv.innerHTML);
                            popup.update();
                        }, 10);
                    } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                        var video = document.createElement('video');
                        video.controls = true;
                        video.src = src;
                        video.style.width = "400px";
                        video.style.height = "300px";
                        video.style.maxHeight = "60vh";
                        video.style.maxWidth = "60vw";
                        imgTd.parentNode.replaceChild(video, imgTd);
                        popup._contentNode.classList.add('media');
                        video.addEventListener('loadedmetadata', function() {
                            popup.update();
                        });
                        setTimeout(function() {
                            popup.setContent(tempDiv.innerHTML);
                            popup.update();
                        }, 10);
                    } else {
                        popup._contentNode.classList.remove('media');
                    }
                } else {
                    popup._contentNode.classList.remove('media');
                }
            }

            var zoomControl = L.control.zoom({
                position: 'topleft'
            }).addTo(map);

            var bounds_group = new L.featureGroup([]);
            function setBounds() {}

            map.createPane('pane_Argenmap_0');
            map.getPane('pane_Argenmap_0').style.zIndex = 400;
            var layer_Argenmap_0 = L.tileLayer('https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/capabaseargenmap@EPSG:3857@png/{z}/{x}/{-y}.png', {
                pane: 'pane_Argenmap_0',
                opacity: 1.0,
                attribution: '',
                minZoom: 1,
                maxZoom: 28,
                minNativeZoom: 0,
                maxNativeZoom: 18
            });
            layer_Argenmap_0;
            map.addLayer(layer_Argenmap_0);

            function pop_Poligono_1(feature, layer) {
                var popupContent = '<table>\
                        <tr>\
                            <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                        </tr>\
                        <tr>\
                            <td colspan="2">' + (feature.properties['test'] !== null ? autolinker.link(String(feature.properties['test']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                        </tr>\
                        <tr>\
                            <td colspan="2">' + (feature.properties['descriptc'] !== null ? autolinker.link(String(feature.properties['descripc']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                        </tr>\
                    </table>';
                var content = removeEmptyRowsFromPopupContent(popupContent, feature);
                layer.on('popupopen', function(e) {
                    addClassToPopupIfMedia(content, e.popup);
                });
                layer.bindPopup(content, { maxHeight: 400 });
            }

            function style_Poligono_1_0() {
                return {
                    pane: 'pane_Poligono_1',
                    opacity: 1,
                    color: 'rgba(35,35,35,1.0)',
                    dashArray: '',
                    lineCap: 'butt',
                    lineJoin: 'miter',
                    weight: 1.0, 
                    fill: true,
                    fillOpacity: 1,
                    fillColor: 'rgba(225,89,137,1.0)',
                    interactive: true,
                }
            }

            map.createPane('pane_Poligono_1');
            map.getPane('pane_Poligono_1').style.zIndex = 401;
            map.getPane('pane_Poligono_1').style['mix-blend-mode'] = 'normal';

            // Esta es la capa que usamos como "recipiente"
            var layer_Poligono_1 = new L.geoJson(json_Poligono_1, {
                attribution: '',
                interactive: true,
                dataVar: 'json_Poligono_1',
                layerName: 'layer_Poligono_1',
                pane: 'pane_Poligono_1',
                onEachFeature: pop_Poligono_1,
                style: style_Poligono_1_0,
            });

            bounds_group.addLayer(layer_Poligono_1);
            map.addLayer(layer_Poligono_1);
            setBounds();


            // --- 3. INYECCIÓN DE SUPABASE ---
            // Este bloque hace la magia: pide los datos reales y los mete en el recipiente
            document.addEventListener("DOMContentLoaded", async function() {
                
                // 1. Inicializar el cliente (Asegurate de poner tus credenciales reales)
                const supabaseUrl = 'https://emmthnrletlglxomcgbs.supabase.co';
                const supabaseKey = 'sb_publishable_CHcG6hJYhsxWtECZKxN8cQ_aSu1mksw';
                const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

                // 2. Llamar a la función RPC de PostGIS que armamos antes
                // Reemplazá 'nombre_de_tu_tabla_poligonos' por el nombre real de la tabla
                const { data, error } = await supabaseClient
                    .rpc('obtener_geojson_tabla', { nombre_tabla: 'punto_test' });

                if (error) {
                    console.error("Error al traer datos de Supabase:", error);
                    return;
                }

                // 3. Limpiar la capa recipiente y cargar el GeoJSON real
                layer_Poligono_1.clearLayers();
                layer_Poligono_1.addData(data);
                
                // Opcional: Centrar el mapa para que abarque todos los polígonos recién cargados
                map.fitBounds(layer_Poligono_1.getBounds());
                
                console.log("¡Polígonos cargados exitosamente!");
            });
        </script>        
    </body>
</html>
